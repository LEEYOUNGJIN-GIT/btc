# 봇이 꺼져 있어도 GitHub 적재 OHLCV·리포트를 최신으로 유지합니다.
# 공개 시세만 사용 (API 키 불필요). schedule cron 은 UTC.
name: Refresh OHLCV

on:
  schedule:
    # 매일 00:15 UTC ≈ Asia/Seoul 09:15. 일봉 마감 후 bundle 갱신.
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유 (선택)"
        required: false
        default: "manual"

concurrency:
  group: refresh-ohlcv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill daily + minute CSV
        run: python backfill.py --timeframe bundle --page-sleep 0.12 --market-sleep 0.15

      - name: Build scalping report
        run: python report.py

      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh UTC OHLCV and scalping report"
          file_pattern: |
            data/daily/*.csv
            data/minute/*.csv
            data/reports/*
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          push_options: ""
